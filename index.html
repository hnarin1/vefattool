    function generateImage() {
        const photoInput = document.getElementById('photoInput');
        const nameInput = document.getElementById('nameInput').value;
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!photoInput.files[0]) {
            alert('Bitte wähle ein Foto aus.');
            return;
        }

        const templateImg = new Image();
        const userPhoto = new Image();

        // 1. Vorlage laden
        templateImg.src = CONFIG.templateUrl;
        templateImg.onload = () => {
            // Canvas an Originalgröße der Vorlage anpassen
            canvas.width = templateImg.width;
            canvas.height = templateImg.height;

            // Vorlage zeichnen
            ctx.drawImage(templateImg, 0, 0);

            // 2. Foto des Verstorbenen laden
            const reader = new FileReader();
            reader.onload = (e) => {
                userPhoto.src = e.target.result;
                userPhoto.onload = () => {
                    // Foto in den Kasten einpassen & zeichnen
                    ctx.drawImage(
                        userPhoto, 
                        CONFIG.photoX, 
                        CONFIG.photoY, 
                        CONFIG.photoWidth, 
                        CONFIG.photoHeight
                    );

                    // 3. Name eintragen (FETT & GROSS)
                    if (nameInput.trim() !== '') {
                        // "bold" wird direkt hier vor der Schriftgröße mitgegeben:
                        ctx.font = `bold ${CONFIG.fontSize}px ${CONFIG.fontFamily}`;
                        ctx.fillStyle = CONFIG.fontColor;
                        ctx.textAlign = 'center'; // Text zentrieren
                        ctx.fillText(nameInput, CONFIG.nameX, CONFIG.nameY);
                    }

                    // 4. Vorschau anzeigen & Download-Button aktivieren
                    canvas.style.display = 'block';
                    downloadBtn.href = canvas.toDataURL('image/png');
                    downloadBtn.style.display = 'block';
                    downloadBtn.style.padding = '12px';
                    downloadBtn.style.color = '#fff';
                    downloadBtn.style.borderRadius = '5px';
                };
            };
            reader.readAsDataURL(photoInput.files[0]);
        };
    }
